services:
  ai-logger:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${AI_LOGGER_PUBLISH_PORT:-8765}:8765"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
