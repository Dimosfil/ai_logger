services:
  ai-logger:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${AI_LOGGER_SERVER_PORT:-8766}:${AI_LOGGER_SERVER_PORT:-8766}"
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('AI_LOGGER_SERVER_PORT','8766')+'/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
